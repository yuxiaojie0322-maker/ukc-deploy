name: ukc-deploy

on:
  push:
    branches:
      - main
    paths:
      - 'vless/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: '操作类型'
        required: true
        default: 'build-and-deploy'
        type: choice
        options:
          - build-and-deploy
          - deploy-only
          - build-only
          - cleanup
      metro:
        description: '目标 metro（留空则部署全部 5 个节点：fra/was/dal/sin/sfo）'
        required: false
        default: ''
      uuid:
        description: 'VLESS 节点 UUID 密钥'
        required: false
        default: '694949f5-54c3-4113-b3c9-2d2518f770f4'
      memory:
        description: '每个实例内存配额 (如 256MiB, 512MiB)'
        required: false
        default: '256MiB'
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间 09:00 自动健康保活与同步

permissions:
  contents: write

env:
  UKC_ORG: xiaojieyu
  IMAGE_NAME: xiaojieyu/vless:latest
  IMAGE_PREFIX: oci://unikraft.io/

jobs:
  build-image:
    if: github.event_name == 'push' || (github.event.inputs.action != 'cleanup' && github.event.inputs.action != 'deploy-only')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install unikraft CLI
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          echo "Installing unikraft CLI v${VERSION}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login to Unikraft
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          set -euo pipefail
          echo "${UKC_TOKEN}" > /tmp/ukc_token.txt
          unikraft login --token /tmp/ukc_token.txt --organization "${UKC_ORG}"

      - name: Build & Push VLESS Unikraft image
        run: |
          set -euo pipefail
          cd vless
          echo "=== Building Unikraft VLESS microkernel image ==="
          unikraft image build . --output /tmp/vless.tar
          
          echo "=== Pushing image to Unikraft Cloud registry ==="
          unikraft image copy /tmp/vless.tar "unikraft.io/${IMAGE_NAME}"
          echo "=== Build and push completed successfully! ==="

  deploy:
    needs: [build-image]
    if: |
      always() &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') &&
      github.event.inputs.action != 'cleanup' &&
      github.event.inputs.action != 'build-only'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        metro: [fra, was, dal, sin, sfo]
    steps:
      - name: Filter Metro
        id: filter
        run: |
          TARGET="${{ github.event.inputs.metro }}"
          CURRENT="${{ matrix.metro }}"
          if [ -n "${TARGET}" ] && [ "${TARGET}" != "${CURRENT}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.filter.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install unikraft CLI
        if: steps.filter.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          echo "Installing unikraft CLI v${VERSION}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login to Unikraft
        if: steps.filter.outputs.skip == 'false'
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          set -euo pipefail
          echo "${UKC_TOKEN}" > /tmp/ukc_token.txt
          unikraft login --token /tmp/ukc_token.txt --organization "${UKC_ORG}"

      - name: Deploy to ${{ matrix.metro }}
        if: steps.filter.outputs.skip == 'false'
        id: deploy
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          METRO: ${{ matrix.metro }}
          CHOSEN_IMAGE: ${{ env.IMAGE_NAME }}
          MEMORY: ${{ github.event.inputs.memory || '256MiB' }}
          NODE_UUID: ${{ github.event.inputs.uuid || '694949f5-54c3-4113-b3c9-2d2518f770f4' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          INSTANCE_NAME="ukc-${METRO}"
          FULL_IMAGE="${IMAGE_PREFIX}${CHOSEN_IMAGE}"
          
          echo "==> 部署到 ${METRO}..."
          echo "    实例名: ${INSTANCE_NAME}"
          echo "    镜像: ${FULL_IMAGE}"
          echo "    内存: ${MEMORY}"
          
          # 检查并清理旧同名实例
          python3 -c "
          import urllib.request, json
          headers = {'Authorization': 'Bearer ${UKC_TOKEN}', 'Content-Type': 'application/json'}
          try:
              req = urllib.request.Request('https://api.${METRO}.unikraft.cloud/v1/instances', headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
              for inst in data.get('data', {}).get('instances', []):
                  if inst.get('name') == '${INSTANCE_NAME}':
                      del_req = urllib.request.Request(f'https://api.${METRO}.unikraft.cloud/v1/instances/{inst[\"uuid\"]}', headers=headers, method='DELETE')
                      urllib.request.urlopen(del_req)
                      print(f'已删除旧实例: {inst[\"uuid\"]}')
          except Exception as e:
              print(f'旧实例检查提示: {e}')
          "
          
          sleep 2
          
          # 启动新微内核实例
          RUN_RES=$(unikraft run \
            --name "${INSTANCE_NAME}" \
            --metro "${METRO}" \
            --image "${FULL_IMAGE}" \
            --memory "${MEMORY}" \
            --vcpus 1 \
            --scale-to-zero "policy=on,cooldown-time=3600000" \
            -p 443:8080/http+tls \
            -p 80:8080/http \
            --env UUID="${NODE_UUID}" \
            -o json 2>&1) || true
          
          echo "创建结果: ${RUN_RES}"
          
          sleep 5
          
          # 获取实例状态与域名
          INFO_JSON=$(python3 -c "
          import urllib.request, json
          headers = {'Authorization': 'Bearer ${UKC_TOKEN}'}
          try:
              req = urllib.request.Request('https://api.${METRO}.unikraft.cloud/v1/instances', headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
              for inst in data.get('data', {}).get('instances', []):
                  if inst.get('name') == '${INSTANCE_NAME}':
                      sg_uuid = inst.get('service_group', {}).get('uuid', '')
                      sg_req = urllib.request.Request(f'https://api.${METRO}.unikraft.cloud/v1/services/{sg_uuid}', headers=headers)
                      with urllib.request.urlopen(sg_req) as sg_resp:
                          sg_data = json.loads(sg_resp.read().decode('utf-8'))
                      fqdn = sg_data.get('data', {}).get('service_groups', [{}])[0].get('domains', [{}])[0].get('fqdn', '')
                      print(json.dumps({'state': inst.get('state', 'unknown'), 'fqdn': fqdn}))
                      break
          except Exception as e:
              print(json.dumps({'state': 'error', 'fqdn': '', 'err': str(e)}))
          ")
          
          STATUS=$(echo "${INFO_JSON}" | jq -r '.state // "unknown"')
          FQDN=$(echo "${INFO_JSON}" | jq -r '.fqdn // "unknown"')
          
          echo "状态: ${STATUS}"
          echo "FQDN: ${FQDN}"
          
          # 冒烟测试探活
          echo "==> 冒烟测试探活..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://${FQDN}/health" 2>/dev/null || echo "000")
          DEPLOY_STATUS="✅ ${STATUS} (HTTP ${HTTP_CODE})"
          echo "检测结果: ${DEPLOY_STATUS}"
          
          # 生成标准 VLESS 链接
          VLESS_LINK="vless://${NODE_UUID}@${FQDN}:443?encryption=none&security=tls&sni=${FQDN}&type=ws&host=${FQDN}&path=%2F#UKC-${METRO}"
          echo "VLESS LINK: ${VLESS_LINK}"
          
          echo "fqdn=${FQDN}" >> $GITHUB_OUTPUT
          echo "status=${DEPLOY_STATUS}" >> $GITHUB_OUTPUT
          echo "metro=${METRO}" >> $GITHUB_OUTPUT
          echo "vless_link=${VLESS_LINK}" >> $GITHUB_OUTPUT
          
          if [ -n "${TG_BOT_TOKEN}" ] && [ -n "${TG_CHAT_ID}" ]; then
            MESSAGE="🚀 UKC-${METRO} VLESS 部署完成\n\n域名: https://${FQDN}\n状态: ${DEPLOY_STATUS}\n\n节点链接:\n\`${VLESS_LINK}\`"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":\"${MESSAGE}\",\"parse_mode\":\"Markdown\"}" \
              || true
          fi

      - name: 汇总报告
        if: steps.filter.outputs.skip == 'false'
        run: |
          METRO="${{ steps.deploy.outputs.metro }}"
          FQDN="${{ steps.deploy.outputs.fqdn }}"
          STATUS="${{ steps.deploy.outputs.status }}"
          VLESS="${{ steps.deploy.outputs.vless_link }}"
          
          echo "### 部署结果 (${METRO})" >> $GITHUB_STEP_SUMMARY
          echo "- **Metro**: ${METRO}" >> $GITHUB_STEP_SUMMARY
          echo "- **FQDN**: https://${FQDN}" >> $GITHUB_STEP_SUMMARY
          echo "- **状态**: ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- **VLESS 节点链接**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "${VLESS}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY