name: ukc-deploy

on:
  workflow_dispatch:
    inputs:
      metro:
        description: '目标 metro（留空则部署全部 5 个节点，或输入单个如 fra/was/dal/sin/sfo）'
        required: false
        default: ''
      memory:
        description: '每个实例内存配额 (如 256MiB, 512MiB, 1024MiB)'
        required: false
        default: '256MiB'
      image:
        description: '指定统一镜像（留空则按节点自动匹配专属镜像：fra-go, dal-js, sfo-java, was-java-obf, sin-py）'
        required: false
        default: ''
      action:
        description: '操作类型'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - cleanup
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间 09:00

permissions:
  contents: read

env:
  UKC_ORG: xiaojieyu
  IMAGE_PREFIX: oci://unikraft.io/

jobs:
  deploy:
    if: github.event.inputs.action != 'cleanup'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - metro: fra
            image: lxy/xapp-go
          - metro: dal
            image: lxy/xapp-js
          - metro: sfo
            image: lxy/xapp-java
          - metro: was
            image: lxy/xapp-java-obf
          - metro: sin
            image: lxy/xapp-py
    steps:
      - name: Filter Metro
        id: filter
        run: |
          TARGET="${{ github.event.inputs.metro }}"
          CURRENT="${{ matrix.metro }}"
          if [ -n "${TARGET}" ] && [ "${TARGET}" != "${CURRENT}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.filter.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install unikraft CLI
        if: steps.filter.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          echo "Installing unikraft CLI v${VERSION}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login to Unikraft
        if: steps.filter.outputs.skip == 'false'
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          set -euo pipefail
          echo "${UKC_TOKEN}" > /tmp/ukc_token.txt
          unikraft login --token /tmp/ukc_token.txt --organization "${UKC_ORG}"

      - name: Deploy to ${{ matrix.metro }}
        if: steps.filter.outputs.skip == 'false'
        id: deploy
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          METRO: ${{ matrix.metro }}
          CHOSEN_IMAGE: ${{ github.event.inputs.image || matrix.image }}
          MEMORY: ${{ github.event.inputs.memory || '256MiB' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          INSTANCE_NAME="xapp-${METRO}"
          FULL_IMAGE="${IMAGE_PREFIX}${CHOSEN_IMAGE}"
          
          echo "==> 部署到 ${METRO}..."
          echo "    实例名: ${INSTANCE_NAME}"
          echo "    镜像: ${FULL_IMAGE}"
          echo "    内存: ${MEMORY}"
          echo "    组织: ${UKC_ORG}"
          
          # 先清理可能存在的同名旧实例
          echo "==> 检查并清理已有实例..."
          unikraft instance delete "${INSTANCE_NAME}" --metro "${METRO}" 2>/dev/null || true
          
          echo "==> 创建常驻实例..."
          RESULT=$(unikraft run \
            --name "${INSTANCE_NAME}" \
            --metro "${METRO}" \
            --image "${FULL_IMAGE}" \
            --memory "${MEMORY}" \
            --vcpus 1 \
            --scale-to-zero "policy=on,cooldown-time=3600000" \
            -p 443:8080/http+tls \
            -p 80:8080/http \
            -o json 2>&1) || true
          
          echo "创建结果: ${RESULT}"
          
          # 获取 FQDN 域名
          FQDN=$(unikraft instance get "${INSTANCE_NAME}" --metro "${METRO}" -o json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else (d.get('data',{}).get('instances',[d])[0] if 'data' in d else d.get('instances',[d])[0]); domains=d.get('service_group',{}).get('domains',[]); print(domains[0].get('fqdn') if domains and isinstance(domains[0],dict) else d.get('fqdn', d.get('domain', 'unknown')))" 2>/dev/null || echo "unknown")
          echo "FQDN: ${FQDN}"
          
          # 立即发送 HTTP 请求激活实例进入 running 状态
          echo "==> 发送流量激活实例..."
          curl -s -o /dev/null -m 10 "https://${FQDN}" 2>/dev/null || true
          sleep 2
          
          # 验证状态
          STATUS=$(unikraft instance get "${INSTANCE_NAME}" --metro "${METRO}" -o json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else (d.get('data',{}).get('instances',[d])[0] if 'data' in d else d.get('instances',[d])[0]); print(d.get('state','unknown'))" 2>/dev/null || echo "error")
          echo "激活后状态: ${STATUS}"
          
          # 冒烟测试
          echo "==> 冒烟测试..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://${FQDN}" 2>/dev/null || echo "000")
          DEPLOY_STATUS="✅ ${STATUS} (HTTP ${HTTP_CODE})"
          echo "状态: ${DEPLOY_STATUS}"
          
          # 输出结果
          echo "fqdn=${FQDN}" >> $GITHUB_OUTPUT
          echo "status=${DEPLOY_STATUS}" >> $GITHUB_OUTPUT
          echo "metro=${METRO}" >> $GITHUB_OUTPUT
          
          # 发送 Telegram 通知
          if [ -n "${TG_BOT_TOKEN}" ] && [ -n "${TG_CHAT_ID}" ]; then
            MESSAGE="🚀 ${METRO} 常驻部署完成\n\n实例: ${INSTANCE_NAME}\n镜像: ${CHOSEN_IMAGE}\nFQDN: https://${FQDN}\n状态: ${DEPLOY_STATUS}"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":\"${MESSAGE}\",\"parse_mode\":\"Markdown\"}" \
              || true
          fi

      - name: 汇总报告
        if: steps.filter.outputs.skip == 'false'
        run: |
          METRO="${{ steps.deploy.outputs.metro }}"
          FQDN="${{ steps.deploy.outputs.fqdn }}"
          STATUS="${{ steps.deploy.outputs.status }}"
          
          echo "### 部署结果 (${METRO})" >> $GITHUB_STEP_SUMMARY
          echo "- **Metro**: ${METRO}" >> $GITHUB_STEP_SUMMARY
          echo "- **FQDN**: https://${FQDN}" >> $GITHUB_STEP_SUMMARY
          echo "- **状态**: ${STATUS}" >> $GITHUB_STEP_SUMMARY

  cleanup:
    if: github.event.inputs.action == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unikraft CLI
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          echo "Installing unikraft CLI v${VERSION}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login to Unikraft
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          echo "${UKC_TOKEN}" > /tmp/ukc_token.txt
          unikraft login --token /tmp/ukc_token.txt --organization "${UKC_ORG}"

      - name: Cleanup all instances
        run: |
          echo "==> 清理所有实例..."
          METROS="fra was dal sin sfo"
          for m in $METROS; do
            echo "检查 ${m}..."
            INSTANCES=$(unikraft instance list --metro "${m}" -o json 2>/dev/null || echo "[]")
            echo "${INSTANCES}" | python3 -c "
          import sys, json, subprocess
          try:
              data = json.load(sys.stdin)
              instances = data if isinstance(data, list) else data.get('instances', [])
          except Exception:
              instances = []
          for inst in instances:
              name = inst.get('name', '')
              if name:
                  print(f'删除实例: {name} (metro: ${m})')
                  subprocess.run(['unikraft', 'instance', 'delete', name, '--metro', '${m}'], check=False)
          "
          done
          echo "清理完成"
