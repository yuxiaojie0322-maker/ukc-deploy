name: test-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install unikraft CLI
        run: |
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          echo "${UKC_TOKEN}" > /tmp/token.txt
          unikraft login --token /tmp/token.txt --organization xiaojieyu

      - name: Inspect CLI Help
        run: |
          echo "=== unikraft run --help ==="
          unikraft run --help || true
          echo "=== unikraft instance --help ==="
          unikraft instance --help || true
          echo "=== unikraft instance start --help ==="
          unikraft instance start --help || true
          echo "=== unikraft instance log --help ==="
          unikraft instance log --help || true

      - name: Test Run without scale-to-zero
        run: |
          echo "==> Testing run without scale-to-zero on fra..."
          unikraft instance delete test-live --metro fra 2>/dev/null || true
          unikraft run \
            --name test-live \
            --metro fra \
            --image oci://unikraft.io/lxy/xapp-go \
            --memory 256MiB \
            --vcpus 1 \
            -p 443:8080/http+tls \
            -p 80:8080/http \
            -o json || true
          
          sleep 5
          echo "==> Checking test-live status..."
          unikraft instance get test-live --metro fra -o json || true
          
          echo "==> Checking test-live log..."
          unikraft instance log test-live --metro fra || true
