name: test-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install unikraft CLI
        run: |
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          echo "${UKC_TOKEN}" > /tmp/token.txt
          unikraft login --token /tmp/token.txt --organization xiaojieyu

      - name: Get Logs of test-live
        run: |
          echo "=== unikraft logs ad62bc96-efb1-493c-841c-f3b01290d041 ==="
          unikraft logs ad62bc96-efb1-493c-841c-f3b01290d041 || true

      - name: Test different args and flags
        run: |
          # Test with --help
          echo "=== Test with -- --help ==="
          unikraft run --rm --metro fra --memory 256MiB oci://unikraft.io/lxy/xapp-go -- --help || true

          echo "=== Test with -e PORT=8080 ==="
          unikraft run --rm --metro fra --memory 256MiB -e PORT=8080 oci://unikraft.io/lxy/xapp-go || true
