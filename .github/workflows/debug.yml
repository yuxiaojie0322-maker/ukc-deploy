name: test-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install unikraft CLI
        run: |
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          echo "${UKC_TOKEN}" > /tmp/token.txt
          unikraft login --token /tmp/token.txt --organization xiaojieyu

      - name: Get Logs of test-live
        run: |
          echo "=== unikraft instance logs --help ==="
          unikraft instance logs --help || true
          echo "=== fetch logs of test-live ==="
          unikraft instance logs ad62bc96-efb1-493c-841c-f3b01290d041 --metro fra || true
          echo "=== fetch logs of xapp-fra ==="
          unikraft instance logs xapp-fra --metro fra || true

      - name: Inspect image metadata
        run: |
          echo "=== unikraft image --help ==="
          unikraft image --help || true
          echo "=== unikraft image list ==="
          unikraft image list || true
