name: test-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install unikraft CLI
        run: |
          VERSION=$(curl -fsSL https://pkg.unikraft.com/endpoints/cli/content/stable.txt | tr -d '\r\n')
          VERSION="${VERSION#v}"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v${VERSION}/unikraft-cli_${VERSION}_linux_amd64.tar.gz" -o /tmp/unikraft.tar.gz
          tar -xzf /tmp/unikraft.tar.gz -C /tmp
          chmod +x /tmp/unikraft
          echo "/tmp" >> $GITHUB_PATH

      - name: Login
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          echo "${UKC_TOKEN}" > /tmp/token.txt
          unikraft login --token /tmp/token.txt --organization xiaojieyu

      - name: Build to tar and copy to registry
        run: |
          mkdir -p /tmp/myvless
          cat << 'EOF' > /tmp/myvless/Kraftfile
          spec: v0.7
          name: myvless
          cmd: ["/server"]
          rootfs: ./Dockerfile
          targets:
            - architecture: x86_64
              platform: kraftcloud
          EOF

          cat << 'EOF' > /tmp/myvless/Dockerfile
          FROM golang:1.22-alpine AS builder
          WORKDIR /app
          RUN echo 'package main' > main.go && \
              echo 'import ("fmt"; "net/http")' >> main.go && \
              echo 'func main() {' >> main.go && \
              echo '  http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) { fmt.Fprintf(w, "vless ready\n") })' >> main.go && \
              echo '  http.ListenAndServe(":8080", nil)' >> main.go && \
              echo '}' >> main.go
          RUN CGO_ENABLED=0 go build -o /server main.go

          FROM scratch
          COPY --from=builder /server /server
          ENTRYPOINT ["/server"]
          EOF

          echo "=== 1. Building to tar ==="
          unikraft image build /tmp/myvless --output /tmp/myvless.tar

          echo "=== 2. Copying tar to Unikraft registry ==="
          unikraft image copy /tmp/myvless.tar unikraft.io/xiaojieyu/myvless:latest

          echo "=== 3. List images ==="
          unikraft image list || true
